name: Notify xeokit-sdk

on:
  push:
    branches:
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to xeokit/xeokit-sdk
        run: |
          curl -sSL -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/xeokit/xeokit-sdk/dispatches \
            -d "{\"event_type\":\"examples-updated\",\"client_payload\":{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}}"
      - name: Send repository_dispatch to creoox/xeokit-docs
        run: |
          curl -sSL -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/xeokit/xeokit-docs/dispatches \
            -d "{\"event_type\":\"examples-updated\",\"client_payload\":{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}}"
